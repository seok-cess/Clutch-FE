name: Build Dev

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on:
      - self-hosted
      - windows
      - x64

    steps:
      - name: Checkout dev
        uses: actions/checkout@v6
        with:
          ref: dev

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: clutch-frontend-dev
          path: dist
          if-no-files-found: error
