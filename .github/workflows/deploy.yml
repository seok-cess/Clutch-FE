name: Build Dev

on:
  push:
    branches:
      - dev

concurrency:
  group: clutch-fe-dev-build
  cancel-in-progress: false

jobs:
  build:
    runs-on:
      - self-hosted
      - windows
      - x64

    steps:
      - name: Stop frontend server
        shell: powershell
        run: |
          $task = Get-ScheduledTask `
            -TaskName "Clutch-FE-Server" `
            -ErrorAction Stop

          if ($task.State -eq "Running") {
            Stop-ScheduledTask `
              -TaskName "Clutch-FE-Server" `
              -ErrorAction Stop
          }

          for ($attempt = 1; $attempt -le 5; $attempt++) {
            $listener = Get-NetTCPConnection `
              -LocalPort 5173 `
              -State Listen `
              -ErrorAction SilentlyContinue

            if (-not $listener) {
              exit 0
            }

            Start-Sleep -Seconds 1
          }

          $listeners = @(
            Get-NetTCPConnection `
              -LocalPort 5173 `
              -State Listen `
              -ErrorAction SilentlyContinue
          )

          $frontendProcessIds = @(
            $listeners |
              Select-Object -ExpandProperty OwningProcess -Unique |
              Where-Object { $_ -gt 0 }
          )

          foreach ($frontendProcessId in $frontendProcessIds) {
            Write-Warning (
              "Force stopping frontend process tree: PID={0}" -f
              $frontendProcessId
            )

            & taskkill.exe /PID $frontendProcessId /T /F

            if ($LASTEXITCODE -ne 0) {
              Write-Warning (
                "Failed to stop frontend process tree: PID={0}" -f
                $frontendProcessId
              )
            }
          }

          for ($attempt = 1; $attempt -le 10; $attempt++) {
            $listener = Get-NetTCPConnection `
              -LocalPort 5173 `
              -State Listen `
              -ErrorAction SilentlyContinue

            if (-not $listener) {
              exit 0
            }

            Start-Sleep -Seconds 1
          }

          throw "Frontend server did not stop"

      - name: Prepare clean workspace
        shell: powershell
        working-directory: ${{ runner.temp }}
        run: |
          $workspace = [System.IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $workspacePrefix = $workspace.TrimEnd("\") + "\"
          $nodeModules = [System.IO.Path]::GetFullPath(
            (Join-Path $workspace "node_modules")
          )

          if (-not $nodeModules.StartsWith(
            $workspacePrefix,
            [System.StringComparison]::OrdinalIgnoreCase
          )) {
            throw "Unsafe node_modules path: $nodeModules"
          }

          $staleProcesses = @(
            Get-Process -Name "esbuild" -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Path -and
                $_.Path.StartsWith(
                  $workspacePrefix,
                  [System.StringComparison]::OrdinalIgnoreCase
                )
              }
          )

          foreach ($process in $staleProcesses) {
            Write-Warning (
              "Stopping stale esbuild process: PID={0}, Path={1}" -f
              $process.Id,
              $process.Path
            )
            Stop-Process -Id $process.Id -Force -ErrorAction Stop
          }

          if (Test-Path -LiteralPath $nodeModules) {
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                Remove-Item `
                  -LiteralPath $nodeModules `
                  -Recurse `
                  -Force `
                  -ErrorAction Stop
                break
              }
              catch {
                if ($attempt -eq 3) {
                  throw
                }
                Write-Warning "Workspace cleanup failed. Retrying..."
                Start-Sleep -Seconds 2
              }
            }
          }

      - name: Checkout dev
        uses: actions/checkout@v6
        with:
          ref: dev

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start frontend server
        shell: powershell
        run: |
          Start-ScheduledTask `
            -TaskName "Clutch-FE-Server" `
            -ErrorAction Stop

      - name: Check frontend health
        shell: powershell
        run: |
          for ($attempt = 1; $attempt -le 15; $attempt++) {
            try {
              $response = Invoke-WebRequest `
                -Uri "http://localhost:5173" `
                -UseBasicParsing `
                -TimeoutSec 5

              if ($response.StatusCode -eq 200) {
                Write-Host "Frontend server is healthy"
                exit 0
              }
            }
            catch {
              Write-Warning "Waiting for frontend server..."
            }

            Start-Sleep -Seconds 2
          }

          throw "Frontend health check failed"

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: clutch-frontend-dev
          path: dist
          if-no-files-found: error
